# =============================================================================
# Leadium — stack de PRODUÇÃO (Docker Swarm + Traefik).
# Deploy via scripts/deploy.sh (build no nó → docker stack deploy).
#
# ISOLAMENTO: Postgres/Redis/RabbitMQ são PRÓPRIOS da Leadium, numa rede interna
# (`leadium_internal`) SEM portas publicadas no host. Não tocam nem reusam o
# Postgres/Redis/n8n que já rodam na VPS. Só `web`, `api` e `landing` tocam a
# rede `network_public` (ingress do Traefik) para receber tráfego externo.
#
# Domínios: app.leadium.com.br (web) · api.leadium.com.br (api) · leadium.com.br (landing)
# =============================================================================

# --- Bloco de env comum aos serviços Node de backend (api + workers) ---
x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgresql://${PG_USER}:${PG_PASSWORD}@postgres:5432/${PG_DB}
  REDIS_URL: redis://redis:6379
  AMQP_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
  SUPABASE_URL: ${SUPABASE_URL}
  SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
  SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
  AUTH_PROVIDER: ${AUTH_PROVIDER:-supabase}
  # Cadastro self-serve (F44): captcha server-side + destino dos emails de verify/reset.
  TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
  AUTH_EMAIL_REDIRECT_URL: ${AUTH_EMAIL_REDIRECT_URL:-}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY}
  ENCRYPTION_KEY_VERSION: ${ENCRYPTION_KEY_VERSION:-1}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
  AGENT_RUNTIME_URL: http://agent-runtime:8001
  AGENT_RUNTIME_TOKEN: ${AGENT_RUNTIME_TOKEN}
  META_APP_ID: ${META_APP_ID:-}
  META_APP_SECRET: ${META_APP_SECRET:-}
  META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-}
  STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
  LOCAL_STORAGE_PATH: /data/storage
  R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
  R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
  R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
  R2_BUCKET: ${R2_BUCKET:-}
  BILLING_ENABLED: ${BILLING_ENABLED:-false}
  # Pagamentos AbacatePay (F42). VALORES vêm do .env de deploy na VPS — NUNCA
  # commitados. Sem ABACATEPAY_API_KEY, o provider cai no Mock (mock.pay.local).
  ABACATEPAY_API_KEY: ${ABACATEPAY_API_KEY:-}
  ABACATEPAY_WEBHOOK_SECRET: ${ABACATEPAY_WEBHOOK_SECRET:-}
  ABACATEPAY_PUBLIC_KEY: ${ABACATEPAY_PUBLIC_KEY:-}
  # Base pública do app (monta return/completion URLs do checkout). Sem isto cairia
  # no CORS_ORIGIN (lista separada por vírgula) → URL inválida.
  APP_PUBLIC_URL: ${APP_PUBLIC_URL:-https://app.leadium.com.br}
  # Régua de cobrança PIX (dunning) — opcionais; o worker tem defaults (3/3/7d).
  BILLING_DUNNING_LEAD_DAYS: ${BILLING_DUNNING_LEAD_DAYS:-}
  BILLING_DUNNING_GRACE_DAYS: ${BILLING_DUNNING_GRACE_DAYS:-}
  BILLING_DUNNING_PASTDUE_DAYS: ${BILLING_DUNNING_PASTDUE_DAYS:-}
  BILLING_PIX_EXPIRES_SECONDS: ${BILLING_PIX_EXPIRES_SECONDS:-}

# --- Política de deploy dos serviços de APP (não das infras stateful) ---
# `start-first`: o Swarm sobe a task nova e só derruba a antiga quando a nova
# passa no healthcheck → zero downtime. `failure_action: rollback` + `monitor`:
# se a task nova não estabilizar em 30s, o Swarm reverte sozinho para a imagem
# anterior. Aplicado só a api/workers/web/agent-runtime/landing — jamais a
# postgres/redis/rabbitmq (volume único; duas instâncias = corrupção).
x-update-policy: &update-policy
  update_config:
    order: start-first
    parallelism: 1
    failure_action: rollback
    monitor: 30s
    max_failure_ratio: 0
  rollback_config:
    order: start-first
    parallelism: 1
    monitor: 20s
    failure_action: pause

services:
  # ==========================================================================
  # INFRA PRÓPRIA (isolada — sem portas no host)
  # ==========================================================================
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
    volumes:
      - leadium_pgdata:/var/lib/postgresql/data
    networks:
      - leadium_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy: { condition: on-failure, delay: 10s, max_attempts: 5 }
      resources:
        limits: { memory: 1024M }
        reservations: { memory: 384M }

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - leadium_redisdata:/data
    networks:
      - leadium_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy: { condition: on-failure, delay: 10s, max_attempts: 5 }
      resources:
        limits: { memory: 256M }
        reservations: { memory: 48M }

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - leadium_rabbitdata:/var/lib/rabbitmq
    # Habilita o plugin rabbitmq_prometheus (porta 15692) além do management, para
    # o Prometheus scrapear fila/conexões direto do backbone. Sobrescreve o
    # enabled_plugins do image (que só traz management) — por isso lista os dois.
    configs:
      - source: rabbitmq_enabled_plugins
        target: /etc/rabbitmq/enabled_plugins
    networks:
      - leadium_internal
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy: { condition: on-failure, delay: 10s, max_attempts: 5 }
      resources:
        limits: { memory: 512M }
        reservations: { memory: 192M }

  # ==========================================================================
  # API — Express 5 + Socket.io (ingress: api.leadium.com.br + /api,/auth,/socket.io de app.)
  # ==========================================================================
  api:
    image: leadium-api:${APP_VERSION:-latest}
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      <<: *app-env
      API_PORT: "3001"
      CORS_ORIGIN: ${CORS_ORIGIN:-https://app.leadium.com.br,https://leadium.com.br}
      CSP_CONNECT_SRC: ${CSP_CONNECT_SRC:-}
    volumes:
      - leadium_storage:/data/storage
    networks:
      - leadium_internal
      - network_public
    # /health valida DB + Redis (+ RabbitMQ após F56-S21): 200 ok / 503 degraded.
    # `node` já está no PATH da imagem; sem dependência de curl/wget.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      <<: *update-policy
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy: { condition: on-failure, delay: 10s, max_attempts: 5 }
      resources:
        limits: { memory: 768M }
        reservations: { memory: 320M }
      labels:
        - "traefik.enable=true"
        - "traefik.http.services.leadium_api.loadbalancer.server.port=3001"
        # api.leadium.com.br — API pública v1 + webhooks Meta (auth por token)
        - "traefik.http.routers.leadium_api.rule=Host(`api.leadium.com.br`)"
        - "traefik.http.routers.leadium_api.entrypoints=websecure"
        - "traefik.http.routers.leadium_api.tls.certresolver=letsencrypt"
        - "traefik.http.routers.leadium_api.service=leadium_api"
        - "traefik.http.routers.leadium_api.priority=10"
        # app.leadium.com.br/{api,auth,socket.io} → API (same-origin; WS nativo no Traefik)
        - "traefik.http.routers.leadium_app_api.rule=Host(`app.leadium.com.br`) && (PathPrefix(`/api`) || PathPrefix(`/auth`) || PathPrefix(`/socket.io`))"
        - "traefik.http.routers.leadium_app_api.entrypoints=websecure"
        - "traefik.http.routers.leadium_app_api.tls.certresolver=letsencrypt"
        - "traefik.http.routers.leadium_app_api.service=leadium_api"
        - "traefik.http.routers.leadium_app_api.priority=20"

  # ==========================================================================
  # WORKERS — 5 consumers + scheduler (sem ingress)
  # ==========================================================================
  workers:
    image: leadium-workers:${APP_VERSION:-latest}
    build:
      context: ../..
      dockerfile: apps/workers/Dockerfile
    environment:
      <<: *app-env
      # Liga o servidor HTTP mínimo de observabilidade (/metrics + /healthz).
      # Opt-in por env; sem isto o processo de workers não sobe porta alguma.
      WORKERS_METRICS_PORT: "9091"
    volumes:
      - leadium_storage:/data/storage
    networks:
      - leadium_internal
    # /healthz (F56-S17) reflete conexão AMQP + último tick dos schedulers.
    # Serve na mesma porta do /metrics (WORKERS_METRICS_PORT=9091).
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:9091/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      <<: *update-policy
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy: { condition: on-failure, delay: 10s, max_attempts: 5 }
      resources:
        limits: { memory: 512M }
        reservations: { memory: 224M }

  # ==========================================================================
  # AGENT-RUNTIME — FastAPI + LangGraph (IA, sem ingress; api fala via http interno)
  # ==========================================================================
  agent-runtime:
    image: leadium-agent-runtime:${APP_VERSION:-latest}
    build:
      context: ../../apps/agent-runtime
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${PG_USER}:${PG_PASSWORD}@postgres:5432/${PG_DB}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      API_BASE_URL: http://api:3001
      AGENT_RUNTIME_TOKEN: ${AGENT_RUNTIME_TOKEN}
    networks:
      - leadium_internal
    # /health faz ping real no Postgres (SELECT 1). `python` no PATH da imagem.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=4).status==200 else 1)\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      <<: *update-policy
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy: { condition: on-failure, delay: 10s, max_attempts: 5 }
      resources:
        limits: { memory: 768M }
        reservations: { memory: 320M }

  # ==========================================================================
  # WEB — Next.js 15 standalone (ingress: app.leadium.com.br)
  # ==========================================================================
  web:
    image: leadium-web:${APP_VERSION:-latest}
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_META_APP_ID: ${META_APP_ID:-}
        NEXT_PUBLIC_META_CONFIG_ID: ${META_CONFIG_ID:-}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        # Build-time: o Next congela os rewrites de /api,/auth,/socket.io no
        # manifest. Sem isto o SSR proxia p/ localhost:3001 → ECONNREFUSED.
        API_PROXY_TARGET: http://api:3001
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Fallback de SSR/rewrites; o roteamento de borda de /api é feito pelo Traefik.
      API_PROXY_TARGET: http://api:3001
      NEXT_PUBLIC_HM_ENV: production
      NEXT_PUBLIC_HM_RELEASE: ${HM_RELEASE:-}
    networks:
      - leadium_internal
      - network_public
    # `/` pode redirecionar (login) — qualquer resposta < 500 conta como vivo.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 45s
    deploy:
      <<: *update-policy
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy: { condition: on-failure, delay: 10s, max_attempts: 5 }
      resources:
        limits: { memory: 384M }
        reservations: { memory: 160M }
      labels:
        - "traefik.enable=true"
        - "traefik.http.services.leadium_web.loadbalancer.server.port=3000"
        - "traefik.http.routers.leadium_web.rule=Host(`app.leadium.com.br`)"
        - "traefik.http.routers.leadium_web.entrypoints=websecure"
        - "traefik.http.routers.leadium_web.tls.certresolver=letsencrypt"
        - "traefik.http.routers.leadium_web.service=leadium_web"
        - "traefik.http.routers.leadium_web.priority=1"

  # ==========================================================================
  # LANDING — apex leadium.com.br (app Vite/React em /landing; serve /privacidade e /termos)
  # ==========================================================================
  landing:
    image: leadium-landing:${APP_VERSION:-latest}
    build:
      context: ../../landing
      dockerfile: Dockerfile
      args:
        VITE_APP_URL: https://app.leadium.com.br
        VITE_CADASTRO_URL: https://app.leadium.com.br
    networks:
      - network_public
    # Healthcheck vem do Dockerfile (wget em / — nginx). start-first + rollback
    # dão troca de imagem sem downtime também na landing.
    deploy:
      <<: *update-policy
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy: { condition: on-failure, delay: 5s, max_attempts: 3 }
      resources:
        limits: { memory: 64M }
        reservations: { memory: 16M }
      labels:
        - "traefik.enable=true"
        - "traefik.http.services.leadium_landing.loadbalancer.server.port=80"
        - "traefik.http.routers.leadium_landing.rule=Host(`leadium.com.br`)"
        - "traefik.http.routers.leadium_landing.entrypoints=websecure"
        - "traefik.http.routers.leadium_landing.tls.certresolver=letsencrypt"
        - "traefik.http.routers.leadium_landing.service=leadium_landing"
        - "traefik.http.routers.leadium_landing.priority=1"

  # ==========================================================================
  # PROMETHEUS — coleta e avalia (scrape api/workers/rabbitmq; regras de alerta).
  # Só na rede interna: sem ingress. Acesso operacional por túnel SSH.
  # ==========================================================================
  prometheus:
    image: prom/prometheus:v2.53.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
      - source: prometheus_alerts
        target: /etc/prometheus/alerts.yml
    volumes:
      - leadium_promdata:/prometheus
    networks:
      - leadium_internal
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy: { condition: on-failure, delay: 10s, max_attempts: 5 }
      resources:
        limits: { memory: 512M }
        reservations: { memory: 128M }

  # ==========================================================================
  # ALERTMANAGER — roteia/dedup/silencia os alertas do Prometheus.
  # ==========================================================================
  alertmanager:
    image: prom/alertmanager:v0.27.0
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    configs:
      - source: alertmanager_config
        target: /etc/alertmanager/alertmanager.yml
    volumes:
      - leadium_alertmanagerdata:/alertmanager
    networks:
      - leadium_internal
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9093/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy: { condition: on-failure, delay: 10s, max_attempts: 5 }
      resources:
        limits: { memory: 128M }
        reservations: { memory: 32M }

# =============================================================================
# Configs do Swarm (distribuídas via Raft; imutáveis — versionar com sufixo se
# mudar o conteúdo, pois o Swarm não atualiza um config existente in-place).
configs:
  prometheus_config:
    file: ../prometheus/prometheus.yml
  prometheus_alerts:
    file: ../prometheus/alerts.yml
  alertmanager_config:
    file: ../prometheus/alertmanager.yml
  rabbitmq_enabled_plugins:
    file: ./rabbitmq/enabled_plugins

# =============================================================================
networks:
  # Ingress do Traefik (criada pelo stack do Traefik; aqui é externa).
  network_public:
    external: true
  # Rede interna da Leadium (isolada das outras stacks). NÃO publica portas no
  # host — Postgres/Redis/RabbitMQ não são acessíveis de fora. Tem egress para a
  # internet (workers/agent-runtime precisam: Meta, OpenRouter, Supabase).
  # `attachable: true` permite o container efêmero de migration se conectar.
  leadium_internal:
    driver: overlay
    attachable: true

volumes:
  leadium_pgdata:
  leadium_redisdata:
  leadium_rabbitdata:
  leadium_storage:
  leadium_promdata:
  leadium_alertmanagerdata:
